version: "2"

sql:
  - engine: "sqlite"
    schema: "migrations"
    queries: "queries"
    gen:
      go:
        package: "sqlc"
        out: "internal/adapters/persistence/sqlc"
        emit_json_tags: true
        emit_prepared_queries: true
        emit_interface: true
        emit_pointers_for_null_types: true
        emit_sql_as_comment: true
